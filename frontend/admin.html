<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Fix - Administração</title>
    <link rel="icon" href="image/logo sFx sem fundo.jpeg">
    <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/portal.css">
    <script defer src="js/config.js"></script><script defer src="js/sfx-core.js"></script><script defer src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="css/sfx-refresh.css" />
</head>
<body>
<main class="portal-page"><div class="container">
    <div class="portal-top"><div><span class="section-tag">Acesso restrito</span><h1>Administração</h1></div><div class="portal-actions"><a class="btn-primary" href="simulador-admin.html">Abrir simulador do carro</a><button class="btn-primary" type="button" onclick="sfxSair()">Sair</button></div></div>
    <section class="portal-grid">
        <div class="metric-card">Usuários<strong id="totalUsuarios">—</strong></div>
        <div class="metric-card">Mecânicas<strong id="totalMecanicas">—</strong></div>
        <div class="metric-card">Pendentes<strong id="mecanicasPendentes">—</strong></div>
        <div class="metric-card">Bloqueadas<strong id="mecanicasBloqueadas">—</strong></div>
        <div class="metric-card">Cadastros em 30 dias<strong id="cadastrosUltimos30Dias">—</strong></div>
    </section>
    <section class="portal-card"><div class="portal-top"><h2>Mecânicas</h2><select id="filtroStatus"><option value="">Todos os status</option><option value="pendente">Pendentes</option><option value="aprovada">Aprovadas</option><option value="bloqueada">Bloqueadas</option></select></div><div class="table-wrap"><table class="portal-table"><thead><tr><th>Nome</th><th>CNPJ</th><th>Contato</th><th>Status</th><th>Ação</th></tr></thead><tbody id="tabelaMecanicas"></tbody></table></div><div class="portal-pagination"><button type="button" class="btn-primary" id="adminMecAnterior" disabled>Anterior</button><span id="adminMecPagina" aria-live="polite">Página 1</span><button type="button" class="btn-primary" id="adminMecProxima" disabled>Próxima</button></div><p id="adminMensagem" class="status-message" role="status"></p><button type="button" id="adminRecarregar" class="btn-primary">Atualizar dados</button></section>
    <section class="portal-card"><h2>Usuários</h2><div class="table-wrap"><table class="portal-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Cadastro</th></tr></thead><tbody id="tabelaUsuarios"></tbody></table></div><div class="portal-pagination"><button type="button" class="btn-primary" id="adminUserAnterior" disabled>Anterior</button><span id="adminUserPagina" aria-live="polite">Página 1</span><button type="button" class="btn-primary" id="adminUserProxima" disabled>Próxima</button></div></section>
</div></main>
<script defer src="js/admin.js"></script>
</body></html>
